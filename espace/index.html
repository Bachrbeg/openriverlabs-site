<style>
:root{--bg:#0B1220;--card:#111A2E;--border:#1B2740;--border2:#2A3A5A;--text:#EEF3F8;--muted:#9FB0C3;--accent:#5EC4D6;--on-accent:#06101C;--bad:#F08A80}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.55;display:flex;flex-direction:column}
a{color:var(--accent)}
.top{max-width:1200px;width:100%;margin:0 auto;padding:18px 24px}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);font-family:'Fraunces',serif;font-weight:600;font-size:21px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 64px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:28px;letter-spacing:-.6px;margin:0;line-height:1.15}
p{margin:0;color:var(--muted);font-size:14.5px}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:17px;letter-spacing:1.5px;padding:12px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--bg);color:var(--text);text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.row input{width:17px;height:17px;accent-color:var(--accent)}
button{font:inherit;font-weight:700;font-size:15px;padding:12px 16px;border-radius:10px;border:none;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
</style>

<script>
(function(){
const P = JSON.parse(document.getElementById("payload").textContent);
const KEY = "orl-espace-key";
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => btoa(String.fromCharCode.apply(null, new Uint8Array(u)));
async function open(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.iv)}, key, b(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function fromStored(){
  let raw = null;
  try { raw = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch(e){}
  if (!raw) return;
  try { await open(await crypto.subtle.importKey("raw", b(raw), "AES-GCM", false, ["decrypt"])); }
  catch(e){ try{ sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); }catch(_){} }
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const code = document.getElementById("code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (!code) return;
  btn.disabled = true; btn.textContent = "Vérification…"; err.textContent = "";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(P.salt), iterations:P.it, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
    await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.iv)}, key, b(P.ct));
    const raw = b64(await crypto.subtle.exportKey("raw", key));
    try { (document.getElementById("remember").checked ? localStorage : sessionStorage).setItem(KEY, raw); } catch(_){}
    await open(key);
  } catch(_) {
    btn.disabled = false; btn.textContent = "Ouvrir";
    err.textContent = "Code incorrect. Vérifiez les caractères et réessayez.";
  }
});
if (!window.crypto || !crypto.subtle) { document.getElementById("err").textContent = "Ce navigateur ne permet pas d'ouvrir la page (HTTPS requis)."; }
else fromStored();
})();
</script>
